<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="安装路径"><defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bad"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="1180" height="560" fill="#0b0f14"/><text x="44" y="58" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="700">从下载到第一个任务：五步，两步要人动</text><text x="44" y="88" font-size="14.5" fill="#8b9bad" text-anchor="start" font-weight="400">没有公证（不花钱买证书），所以第一次必须「右键 → 打开」；之后就是普通的双击</text><rect x="44" y="124" width="199" height="178" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="62" y="156" font-size="20" fill="#38bdf8" text-anchor="start" font-weight="700">1</text><text x="86" y="156" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">拿到 zip</text><text x="62" y="190" font-size="11.5" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">Workbench-0.2.0.zip</text><text x="62" y="220" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">11 MB · 内核已打包</text><text x="62" y="250" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">不需要另装 node</text><path d="M247,213 L261,213" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-cyan)"/><rect x="267" y="124" width="199" height="178" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="285" y="156" font-size="20" fill="#38bdf8" text-anchor="start" font-weight="700">2</text><text x="309" y="156" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">拖进「应用程序」</text><text x="285" y="190" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">右键 → 打开（首次）</text><text x="285" y="220" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">双击会被 Gatekeeper 拦</text><text x="285" y="250" font-size="11.5" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">或 xattr -dr</text><path d="M470,213 L484,213" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><rect x="490" y="124" width="199" height="178" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="508" y="156" font-size="20" fill="#34d399" text-anchor="start" font-weight="700">3</text><text x="532" y="156" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">选一个工作区</text><text x="508" y="190" font-size="11.5" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">默认 ~/Workbench</text><text x="508" y="220" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">只问一次，记 UserDefaults</text><text x="508" y="250" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">取消也不卡启动</text><path d="M693,213 L707,213" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><rect x="713" y="124" width="199" height="178" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="731" y="156" font-size="20" fill="#34d399" text-anchor="start" font-weight="700">4</text><text x="755" y="156" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">自动补齐并起内核</text><text x="731" y="190" font-size="11.5" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">data/ worktrees/ .oc/ demo/</text><text x="731" y="220" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">起 server + worker</text><text x="731" y="250" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">窗口里是收件箱</text><path d="M916,213 L930,213" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><rect x="936" y="124" width="199" height="178" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="954" y="156" font-size="20" fill="#34d399" text-anchor="start" font-weight="700">5</text><text x="978" y="156" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">建任务，等它跑</text><text x="954" y="190" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">机器实现 + 自己验收</text><text x="954" y="220" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">到「待初筛/待批准」找你</text><text x="954" y="250" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">⌘O 开数据目录</text><text x="143.5" y="110" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600">要人动手</text><text x="1035.5" y="110" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">之后全是后台</text><rect x="44" y="348" width="520" height="132" rx="12" fill="#101821" stroke="#fbbf24" stroke-width="1.2"/><text x="66" y="378" font-size="15.5" fill="#fbbf24" text-anchor="start" font-weight="600">起不来怎么查（不用猜）</text><text x="66" y="404" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">~/Library/Logs/Workbench/kernel.log</text><text x="66" y="424" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">每行带 [server] / [worker] 前缀，两个进程不搅在一起</text><text x="66" y="446" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">WB_SHELL_SMOKE=1 自检：内核就绪？attach 还是 spawn？</text><text x="66" y="466" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">窗口里也会直接写「端口 7399 被别的服务占着」</text><rect x="588" y="348" width="548" height="132" rx="12" fill="#101821" stroke="#a78bfa" stroke-width="1.2"/><text x="610" y="378" font-size="15.5" fill="#a78bfa" text-anchor="start" font-weight="600">想换端口 / 换目录 / 接真引擎</text><text x="610" y="404" font-size="12" fill="#8b9bad" text-anchor="start" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WB_PORT=7500 WB_WORKSPACE=~/ws open -a Workbench</text><text x="610" y="424" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">凭据放 &lt;工作区&gt;/.oc/：不会进 app 包，也不会进仓库</text><text x="610" y="446" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">WB_ENGINE=opencode 才会真烧 token（默认 mock 不花钱）</text><text x="610" y="466" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">开发期 WB_KERNEL=&lt;仓库&gt; 直接指向源码，不用重打包</text><text x="44" y="544" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">装完这一步就可以把终端关掉：进度、心跳、日志、待办全在窗口里；数据在你选的目录里，卸掉 app 不影响账本</text></svg>