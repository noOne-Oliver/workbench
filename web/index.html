<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工作台 · 评审收件箱</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>评审收件箱</h1>
    <div class="meta">
      <span id="who" class="me">…</span>
      <button id="team-btn" class="ghost" hidden onclick="openTeam()">成员</button>
      <button id="logout" class="ghost" hidden onclick="logout()" title="清掉登录 cookie">退出</button>
      <span id="kernel-state" class="mono dim" title="执行器（worker）活体状态：它死了任务就不会再推进">执行器 …</span>
      <span id="clock"></span>
    </div>
  </header>
  <section id="compose">
    <details id="compose-box">
      <summary>＋ 新建任务（后台自动开跑，只在需要你 review 时找你）</summary>
      <form id="new-task" autocomplete="off">
        <input id="t-title" placeholder="要 agent 做什么（一句话）" size="42" required />
        <input id="t-repo" placeholder="目标仓库路径" size="36" required />
        <input id="t-budget" type="number" min="1000" step="1000" value="1000000" title="token 预算" />
        <button class="primary" type="submit">提交给后台</button>
        <span id="compose-msg"></span>
      </form>
      <div class="row mono" id="ws-info"></div>
    </details>
  </section>
  <main>
    <section id="queue" class="col">
      <h2>待处理 <span id="n-await" class="pill">0</span>
        <span class="hint">初筛 30 秒 · 终审只回答「要不要合」</span>
      </h2>
      <div id="awaiting" class="cards"></div>
    </section>
    <section id="inflight" class="col">
      <h2>后台在跑 <span id="n-run" class="pill">0</span></h2>
      <div id="running" class="cards"></div>
    </section>
    <section id="archive" class="col">
      <h2>归档 <span id="n-done" class="pill">0</span></h2>
      <div id="done" class="cards"></div>
    </section>
  </main>
  <section id="activity-panel">
    <h2>后台在跑什么 <span id="n-act" class="pill">0</span>
      <button id="filter-chip" class="ghost" onclick="clearFilter()" style="display:none"></button>
      <span class="hint">每 2.5 秒刷新 · 心跳 15 秒一次 · 静默 60 秒判死</span>
    </h2>
    <ol id="events" class="events"></ol>
  </section>
  <dialog id="raw-viewer">
    <div class="rv-head"><b id="rv-title"></b><button class="ghost" onclick="document.getElementById('raw-viewer').close()">关闭</button></div>
    <pre id="rv-body"></pre>
  </dialog>
  <dialog id="team">
    <div class="rv-head"><b>团队成员</b><button class="ghost" onclick="document.getElementById('team').close()">关闭</button></div>
    <div id="team-body"></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
