<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="784" viewBox="0 0 1180 784" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" role="img" aria-label="桌面版架构"><defs><marker id="a-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#34d399"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f87171"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b9bad"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs><rect width="1180" height="784" fill="#0b0f14"/><text x="44" y="58" font-size="25" fill="#e6edf3" text-anchor="start" font-weight="700">桌面版架构：内核装进 .app，数据留在你自己的目录</text><text x="44" y="88" font-size="14.5" fill="#8b9bad" text-anchor="start" font-weight="400">双击打开就有一个窗口；不用终端、不用装 node、不用云账号。关掉窗口任务也不会停，worker 还在后台跑</text><rect x="300" y="120" width="580" height="88" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="590" y="152" font-size="17" fill="#38bdf8" text-anchor="middle" font-weight="600">人（一个窗口，没有终端）</text><text x="590" y="176" font-size="13.5" fill="#8b9bad" text-anchor="middle" font-weight="400">提交一句话任务 · 初筛 30 秒 · 终审要不要合</text><text x="590" y="196" font-size="13" fill="#8b9bad" text-anchor="middle" font-weight="400">其余时间窗口可以关掉，任务照跑</text><path d="M590,208 L590,250" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-cyan)"/><text x="604" y="235" font-size="12.5" fill="#38bdf8" text-anchor="start" font-weight="400">WKWebView 里就是同一个页面</text><rect x="110" y="252" width="960" height="192" rx="12" fill="#0d141c" stroke="#22303f" stroke-width="1.2"/><text x="134" y="280" font-size="15" fill="#8b9bad" text-anchor="start" font-weight="600">Workbench.app —— 一个包，双击即用（macOS 13+ / Apple Silicon）</text><rect x="134" y="296" width="420" height="126" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="154" y="322" font-size="15.5" fill="#38bdf8" text-anchor="start" font-weight="600">Swift 外壳 apps/macshell</text><text x="154" y="348" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">窗口 = WKWebView，界面一行没重写</text><text x="154" y="370" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">首次启动选工作区，记进 UserDefaults</text><text x="154" y="392" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">只起自己起的两个子进程，退出全收干净</text><text x="154" y="412" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">⌘R 重连 · ⌘O 开数据目录 · ⌘Q 退出</text><path d="M560,358 L596,358" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><text x="578" y="348" font-size="11.5" fill="#34d399" text-anchor="middle" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">spawn</text><rect x="600" y="296" width="446" height="126" rx="12" fill="#101821" stroke="#a78bfa" stroke-width="1.2"/><text x="620" y="322" font-size="15.5" fill="#a78bfa" text-anchor="start" font-weight="600">打包的内核 Contents/Resources/kernel</text><text x="620" y="348" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">node + src/ + web/ 全在包里 → 不需要装 node</text><text x="620" y="370" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">离仓可运行：拷到 /tmp 或 /Applications 都能跑</text><text x="620" y="392" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">ad-hoc 签名，只在本机可信（没公证）</text><text x="620" y="412" font-size="12.5" fill="#8b9bad" text-anchor="start" font-weight="400">同一份内核也能当 Web 服务跑 = 团队版</text><path d="M590,444 L590,492" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-amber)"/><text x="604" y="470" font-size="12.5" fill="#fbbf24" text-anchor="start" font-weight="400">WB_ROOT / WB_DB 指到这里</text><rect x="240" y="494" width="700" height="112" rx="12" fill="#101821" stroke="#fbbf24" stroke-width="1.2"/><text x="262" y="524" font-size="17" fill="#fbbf24" text-anchor="start" font-weight="600">工作区（数据在这，不在 app 里）</text><text x="262" y="548" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">~/Workbench：data/ledger.db（事件账本）· worktrees/ · .oc/（引擎凭据）· demo/（起始仓库）</text><text x="262" y="570" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">外壳启动前只补缺、不覆盖：删了 app 账本还在，换机器就是拷这个目录</text><text x="262" y="592" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">账本只追加：kill -9 之后重放，不失忆、不乱序、不重复扣钱</text><path d="M430,606 L430,630" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-green)"/><text x="444" y="624" font-size="12" fill="#34d399" text-anchor="start" font-weight="400">领任务 / 落事件</text><path d="M830,606 L830,630" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-amber)"/><text x="844" y="624" font-size="12" fill="#fbbf24" text-anchor="start" font-weight="400">改动只在 worktree</text><rect x="150" y="634" width="400" height="106" rx="12" fill="#101821" stroke="#34d399" stroke-width="1.2"/><text x="172" y="662" font-size="16" fill="#34d399" text-anchor="start" font-weight="600">worker（常驻，崩了自动拉起）</text><text x="172" y="686" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">状态机 · 重试 ≤3 轮 · 预算熔断 · 体量分级</text><text x="172" y="708" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">每次调用落 started / heartbeat / finished 三条事件</text><text x="172" y="728" font-size="12" fill="#8b9bad" text-anchor="start" font-weight="400">界面靠心跳分得清「模型在思考」和「worker 已死」</text><path d="M556,687 L602,687" fill="none" stroke="#8b9bad" stroke-width="1.6" marker-end="url(#a-cyan)"/><text x="579" y="678" font-size="11.5" fill="#38bdf8" text-anchor="middle" font-weight="400">一个角色</text><text x="579" y="701" font-size="11.5" fill="#38bdf8" text-anchor="middle" font-weight="400">一个进程</text><rect x="604" y="634" width="442" height="106" rx="12" fill="#101821" stroke="#38bdf8" stroke-width="1.2"/><text x="626" y="662" font-size="16" fill="#38bdf8" text-anchor="start" font-weight="600">agent provider（可换）</text><text x="626" y="686" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">mock 假引擎 / opencode 真模型（凭据放 .oc/）</text><text x="626" y="708" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">Verifier 是另一个进程，拿不到 Coder 的上下文</text><text x="626" y="728" font-size="12" fill="#8b9bad" text-anchor="start" font-weight="400">确定性失败（权限被拒/欠费）直接停，不空烧额度</text><text x="44" y="768" font-size="13" fill="#8b9bad" text-anchor="start" font-weight="400">四条不变量：账本只追加 · 单任务单 worker · 改动只在 worktree · 合并必须由人批准</text></svg>